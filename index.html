<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Là Triệu Phú</title>
    <!-- Thêm hiệu ứng pháo hoa Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffe4e1; /* Hồng pastel nhẹ nhàng */
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: #fff0f5; /* Hồng phấn sáng */
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255, 182, 193, 0.4);
            text-align: center;
            border: 3px solid #ffb6c1;
            position: relative;
        }

        h1.title {
            color: #d87093;
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* Nút Trang chủ */
        .btn-home {
            background-color: #ffb6c1;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 15px;
            display: inline-block;
        }

        .btn-home:hover {
            background-color: #ff69b4;
        }

        /* Màn hình Menu */
        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .btn-play {
            background-color: #ffb6c1;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
            transition: all 0.2s ease;
            margin-top: 20px;
        }

        .btn-play:hover {
            background-color: #ff69b4;
            transform: scale(1.05);
        }

        /* Màn hình Game */
        #game-screen {
            display: none;
            text-align: left;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #b03060;
            background: #ffe4e1;
            padding: 10px 15px;
            border-radius: 10px;
        }

        .question-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            border: 2px dashed #ffb6c1;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #555;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .answer-btn {
            background-color: #ffffff;
            border: 2px solid #ffb6c1;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.05rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-weight: 500;
            color: #444;
        }

        .answer-btn:hover:not(:disabled) {
            background-color: #fff0f5;
            border-color: #ff69b4;
        }

        /* Trạng thái đáp án */
        .answer-btn.correct {
            background-color: #98fb98 !important;
            border-color: #3cb371 !important;
            color: #006400 !important;
        }

        .answer-btn.wrong {
            background-color: #ffb6c1 !important;
            border-color: #ff4500 !important;
            color: #8b0000 !important;
        }

        /* Màn hình Hộp Quà Chiến Thắng */
        #gift-screen {
            display: none;
        }

        .gift-box {
            font-size: 6rem;
            cursor: pointer;
            margin: 20px 0;
            animation: bounce 1s infinite alternate;
            display: inline-block;
            user-select: none;
        }

        @keyframes bounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-15px) scale(1.1); }
        }

        /* Hiệu ứng Tiền Bay Vòng Vòng */
        .flying-money {
            position: fixed;
            font-size: 2rem;
            font-weight: bold;
            color: #ff1493;
            background: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border: 2px solid #ff69b4;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
        }

        @keyframes spinAndFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            30% {
                transform: translate(-100px, -100px) scale(1.5) rotate(360deg);
            }
            60% {
                transform: translate(100px, -150px) scale(1.3) rotate(720deg);
            }
            100% {
                opacity: 1;
                transform: translate(var(--target-x), var(--target-y)) scale(0.2) rotate(1080deg);
            }
        }

        /* Màn hình Kết thúc */
        #end-screen {
            display: none;
        }

        .btn-action-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-restart, .btn-main-home {
            background-color: #ffb6c1;
            color: white;
            font-size: 1.1rem;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-restart:hover, .btn-main-home:hover {
            background-color: #ff69b4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">Ai Là Triệu Phú</h1>

        <!-- MENU SCREEN -->
        <div id="menu-screen">
            <p style="margin-bottom: 10px; font-size: 1.1rem; color: #b03060;">Sẵn sàng chinh phục 15 câu hỏi Phong Tục Truyền Thống Việt Nam chưa?</p>
            <button class="btn-play" onclick="startGame()">CHƠI</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen">
            <button class="btn-home" onclick="goHome()">🏠 Trang chủ</button>
            <div class="game-header">
                <span id="question-counter">Câu 1/15</span>
                <span id="timer-display">⏱️ 15s</span>
                <span id="money-display">💰 0 Tiền</span>
            </div>
            <div class="question-box" id="question-text">Đang tải câu hỏi...</div>
            <div class="answers-grid">
                <button class="answer-btn" id="btn-0" onclick="selectAnswer(0)"></button>
                <button class="answer-btn" id="btn-1" onclick="selectAnswer(1)"></button>
                <button class="answer-btn" id="btn-2" onclick="selectAnswer(2)"></button>
                <button class="answer-btn" id="btn-3" onclick="selectAnswer(3)"></button>
            </div>
        </div>

        <!-- GIFT SCREEN -->
        <div id="gift-screen">
            <h2 style="color: #d87093;">BẠN ĐÃ THẮNG CẢ 15 CÂU HỎI!</h2>
            <p style="margin-top: 10px; color: #b03060; font-size: 1.1rem;">Bấm vào hộp quà bên dưới để nhận thưởng lớn nha! 🎁</p>
            <div class="gift-box" onclick="openGift()">🎁</div>
        </div>

        <!-- END SCREEN -->
        <div id="end-screen">
            <h2 id="end-title" style="color: #d87093; margin-bottom: 15px;">KẾT THÚC TRÒ CHƠI</h2>
            <p id="end-message" style="font-size: 1.2rem; margin-bottom: 15px;"></p>
            <div class="btn-action-group">
                <button class="btn-restart" onclick="resetGame()">Chơi Lại</button>
                <button class="btn-main-home" onclick="goHome()">🏠 Trang Chủ</button>
            </div>
        </div>
    </div>

    <!-- Element hiệu ứng tiền bay -->
    <div id="flying-money-element" class="flying-money">💰 +200 Tiền</div>

    <script>
        // 15 câu hỏi Phong tục Truyền thống Việt Nam
        const questions = [
            {
                q: "Câu 1: Theo phong tục ngày Tết Nguyên Đán, người lớn thường tặng món gì cho trẻ em để chúc may mắn?",
                choices: ["A. Bánh chưng", "B. Lì xì mừng tuổi", "C. Cây hoa đào", "D. Dưa hấu"],
                answer: 1
            },
            {
                q: "Câu 2: Phong tục tiễn Táo Quân (Ông Táo) về trời báo cáo ngọc hoàng diễn ra vào ngày nào trong tháng Chạp?",
                choices: ["A. Ngày 15", "B. Ngày 20", "C. Ngày 23", "D. Ngày 30"],
                answer: 2
            },
            {
                q: "Câu 3: Theo dân gian Việt Nam, phương tiện đưa Ông Táo cưỡi về trời là con vật nào?",
                choices: ["A. Con Ngựa", "B. Con Trâu", "C. Con Cá chép", "D. Con Chim sẻ"],
                answer: 2
            },
            {
                q: "Câu 4: Món ăn truyền thống không thể thiếu trên mâm cỗ Tết của người miền Bắc là gì?",
                choices: ["A. Bánh tét", "B. Bánh chưng", "C. Bánh xèo", "D. Bánh khọt"],
                answer: 1
            },
            {
                q: "Câu 5: Tết Trung Thu (rằm tháng Tám) còn được dân gian gọi bằng tên gọi nào khác?",
                choices: ["A. Tết Mới", "B. Tết Trông Trăng (Tết Đoàn Viên)", "C. Tết Hàn Thực", "D. Tết Đoan Ngọ"],
                answer: 1
            },
            {
                q: "Câu 6: Theo phong tục cổ truyền, 'Mâm ngũ quả' ngày Tết thường biểu tượng cho điều gì?",
                choices: ["A. 5 yếu tố Ngũ hành (Kim, Mộc, Thủy, Hỏa, Thổ)", "B. 5 mùa trong năm", "C. 5 giác quan", "D. 5 châu lục"],
                answer: 0
            },
            {
                q: "Câu 7: Tục ngữ Việt Nam có câu: 'Miếng ___ là đầu câu chuyện'?",
                choices: ["A. Bánh", "B. Trầu", "C. Trà", "D. Cơm"],
                answer: 1
            },
            {
                q: "Câu 8: Ngày Tết Đoan Ngọ (rằm tháng 5 âm lịch) trong dân gian Việt Nam còn có tên gọi dân dã là gì?",
                choices: ["A. Tết diệt sâu bọ", "B. Tết cơm mới", "C. Tết thả hoa đăng", "D. Tết hạ nêu"],
                answer: 0
            },
            {
                q: "Câu 9: Tục lệ 'Xông đất' đầu năm mới nghĩa là gì?",
                choices: ["A. Dọn dẹp nhà cửa", "B. Người đầu tiên bước vào nhà sau thời khắc giao thừa", "C. Tưới nước cho cây trồng", "D. Mua đất làm nhà"],
                answer: 1
            },
            {
                q: "Câu 10: Vào ngày Mùng 3 Tết Nguyên Đán, người Việt xưa có phong tục tri ân ai ('Mùng 1 Tết cha, mùng 2 Tết mẹ, mùng 3 Tết ___')?",
                choices: ["A. Bạn", "B. Thầy", "C. Bác", "D. Ông"],
                answer: 1
            },
            {
                q: "Câu 11: Trong lễ cưới truyền thống Việt Nam, hai nghi lễ quan trọng nhất bắt buộc phải có là gì?",
                choices: ["A. Dặm ngõ và Thử áo", "B. Lễ Dạm ngõ (Chạm ngõ) và Lễ Rước dâu", "C. Đặt cọc và Đãi tiệc", "D. Đám hỏi và Đám cưới ở nhà hàng"],
                answer: 1
            },
            {
                q: "Câu 12: Phong tục cúng 'Thôi nôi' cho trẻ em Việt Nam được thực hiện vào thời điểm nào?",
                choices: ["A. Trẻ tròn 1 tháng tuổi", "B. Trẻ tròn 100 ngày", "C. Trẻ tròn 1 tuổi (12 tháng)", "D. Trẻ tròn 3 tuổi"],
                answer: 2
            },
            {
                q: "Câu 13: Cây 'Nêu' ngày Tết được dựng lên trước cửa nhà thời xưa có ý nghĩa chính là gì?",
                choices: ["A. Để trang trí cho đẹp", "B. Để xua đuổi ma quỷ và xui xẻo", "C. Để làm giàn cho cây leo", "D. Để treo đèn lồng"],
                answer: 1
            },
            {
                q: "Câu 14: Tục nhuộm răng đen và ăn trầu là nét văn hóa truyền thống cổ xưa của tộc người nào?",
                choices: ["A. Người Việt (Kinh) cổ", "B. Người Chăm", "C. Người Khmer", "D. Người Hoa"],
                answer: 0
            },
            {
                q: "Câu 15: Lễ hội 'Gióng' (ở Sóc Sơn và Xuân Đỉnh) tôn vinh vị thánh nào trong 'Tứ bất tử' của tín ngưỡng Việt Nam?",
                choices: ["A. Tản Viên Sơn Thánh", "B. Chử Đồng Tử", "C. Mẫu Liễu Hạnh", "D. Thánh Gióng (Phù Đổng Thiên Vương)"],
                answer: 3
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let timer;
        let timeLeft = 15;
        let lockAnswers = false;

        function startGame() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('gift-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'none';
            currentQuestionIndex = 0;
            score = 0;
            updateMoneyDisplay();
            loadQuestion();
        }

        function goHome() {
            clearInterval(timer);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('gift-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex';
        }

        function loadQuestion() {
            lockAnswers = false;
            clearInterval(timer);
            timeLeft = 15;
            document.getElementById('timer-display').innerText = `⏱️ ${timeLeft}s`;

            if (currentQuestionIndex >= questions.length) {
                showGiftScreen();
                return;
            }

            let qData = questions[currentQuestionIndex];
            document.getElementById('question-counter').innerText = `Câu ${currentQuestionIndex + 1}/15`;
            document.getElementById('question-text').innerText = qData.q;

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`btn-${i}`);
                btn.innerText = qData.choices[i];
                btn.className = "answer-btn";
                btn.disabled = false;
            }

            startTimer();
        }

        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = `⏱️ ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            lockAnswers = true;
            let correctIndex = questions[currentQuestionIndex].answer;
            document.getElementById(`btn-${correctIndex}`).classList.add('correct');
            setTimeout(() => {
                endGame(false, "Hết giờ mất rồi!");
            }, 1500);
        }

        function selectAnswer(selectedIndex) {
            if (lockAnswers) return;
            lockAnswers = true;
            clearInterval(timer);

            let correctIndex = questions[currentQuestionIndex].answer;
            let selectedBtn = document.getElementById(`btn-${selectedIndex}`);
            let correctBtn = document.getElementById(`btn-${correctIndex}`);

            if (selectedIndex === correctIndex) {
                selectedBtn.classList.add('correct');
                score += 20;
                updateMoneyDisplay();

                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion();
                }, 1500);
            } else {
                selectedBtn.classList.add('wrong');
                correctBtn.classList.add('correct');
                score -= 20;
                if (score < 0) score = 0;
                updateMoneyDisplay();

                setTimeout(() => {
                    endGame(false, "Bạn đã trả lời sai!");
                }, 1800);
            }
        }

        function updateMoneyDisplay() {
            document.getElementById('money-display').innerText = `💰 ${score} Tiền`;
        }

        function showGiftScreen() {
            clearInterval(timer);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('gift-screen').style.display = 'block';

            confetti({
                particleCount: 250,
                spread: 120,
                origin: { y: 0.5 }
            });
        }

        function openGift() {
            let giftBox = document.querySelector('.gift-box');
            giftBox.onclick = null;
            giftBox.innerText = '🔓';

            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 }
            });

            let flyingEl = document.getElementById('flying-money-element');
            let startX = window.innerWidth / 2 - 80;
            let startY = window.innerHeight / 2;

            let moneyDisplay = document.getElementById('money-display');
            let rect = moneyDisplay.getBoundingClientRect();
            let targetX = rect.left - startX;
            let targetY = rect.top - startY;

            flyingEl.style.left = `${startX}px`;
            flyingEl.style.top = `${startY}px`;
            flyingEl.style.setProperty('--target-x', `${targetX}px`);
            flyingEl.style.setProperty('--target-y', `${targetY}px`);

            flyingEl.style.animation = 'spinAndFly 2s forwards ease-in-out';

            setTimeout(() => {
                score += 200;
                updateMoneyDisplay();
                flyingEl.style.animation = 'none';

                setTimeout(() => {
                    endGame(true);
                }, 800);
            }, 2000);
        }

        function endGame(isWon, message = "") {
            clearInterval(timer);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('gift-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';

            let endTitle = document.getElementById('end-title');
            let endMsg = document.getElementById('end-message');

            if (isWon) {
                endTitle.innerText = "CHÚC MỪNG BẠN ĐÃ THẮNG!";
                endMsg.innerHTML = `Xuất sắc hoàn thành 15 câu hỏi!<br>Đã nhận thưởng 200 tiền thành công 🎉<br>Tổng số tiền của bạn: <b>${score} Tiền</b>`;
            } else {
                endTitle.innerText = "TRÒ CHƠI KẾT THÚC";
                endMsg.innerHTML = `${message}<br>Số tiền bạn nhận được: <b>${score} Tiền</b>`;
            }
        }

        function resetGame() {
            startGame();
        }
    </script>
</body>
</html>
