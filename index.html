<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Là Triệu Phú</title>
    <!-- Thêm hiệu ứng pháo hoa Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffe4e1; /* Hồng pastel nhẹ nhàng */
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: #fff0f5; /* Hồng phấn sáng */
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255, 182, 193, 0.4);
            text-align: center;
            border: 3px solid #ffb6c1;
            position: relative;
        }

        h1.title {
            color: #d87093;
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* Nút Trang chủ */
        .btn-home {
            background-color: #ffb6c1;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 15px;
            display: inline-block;
        }

        .btn-home:hover {
            background-color: #ff69b4;
        }

        /* Màn hình Menu */
        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .btn-play {
            background-color: #ffb6c1;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
            transition: all 0.2s ease;
            margin-top: 20px;
        }

        .btn-play:hover {
            background-color: #ff69b4;
            transform: scale(1.05);
        }

        /* Màn hình Game */
        #game-screen {
            display: none;
            text-align: left;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
